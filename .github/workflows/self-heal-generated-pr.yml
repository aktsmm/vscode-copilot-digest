name: Self-heal generated PR

on:
  workflow_run:
    workflows:
      - Validate generated PR
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  self-heal:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Post fix-it feedback on the failed PR
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- self-heal-feedback -->';
            const issueMarker = '<!-- self-heal-issue-escalation -->';
            const maxFeedbackAttempts = 3;
            const pullRequests = context.payload.workflow_run.pull_requests || [];

            if (pullRequests.length === 0) {
              core.info('No pull request associated with this workflow run.');
              return;
            }

            const prNumber = pullRequests[0].number;
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const pr = pull.data;

            if (pr.state !== 'open') {
              core.info(`PR #${prNumber} is not open. Skipping self-heal.`);
              return;
            }

            const isCopilotPr =
              /copilot/i.test(pr.user?.login || '') ||
              (pr.labels || []).some((label) => label.name === 'auto-pr');

            if (!isCopilotPr) {
              core.info(`PR #${prNumber} is not a Copilot-generated PR. Skipping.`);
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const feedbackComments = comments.filter((c) => (c.body || '').includes(marker));

            const alreadyGaveUp = feedbackComments.some((c) =>
              (c.body || '').includes('手動で確認してください'),
            );

            if (alreadyGaveUp) {
              core.info(`PR #${prNumber} already escalated to human review. Skipping.`);
              return;
            }

            if (feedbackComments.length >= maxFeedbackAttempts) {
              core.info(`PR #${prNumber} already has ${feedbackComments.length} self-heal attempts. Closing PR and labelling for human review.`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['needs-human-review'],
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `${marker}\n\n自動修正を ${maxFeedbackAttempts} 回試みましたが、validate が通りません。PR を close します。手動で確認してください。`,
              });
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: 'closed',
              });

              // Find and label the linked digest-authoring Issue so it doesn't stay silently stuck
              const dateKeyMatch = (pr.title || '').match(/(\d{4}-\d{2}-\d{2})/);
              if (dateKeyMatch) {
                const issueTitle = `Digest authoring request: ${dateKeyMatch[1]}`;
                const openIssues = await github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: 'digest-authoring',
                  per_page: 100,
                });
                const linkedIssue = openIssues.find((issue) => issue.title === issueTitle);
                if (linkedIssue) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: linkedIssue.number,
                    labels: ['needs-human-review'],
                  });
                  const issueComments = await github.paginate(github.rest.issues.listComments, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: linkedIssue.number,
                    per_page: 100,
                  });
                  const issueBody = [
                    issueMarker,
                    `Generated PR #${prNumber} was closed after ${maxFeedbackAttempts} failed self-heal attempts.`,
                    '- `needs-human-review` was added automatically.',
                    '- Remove the label only after the underlying content or policy failure is fixed.',
                  ].join('\n');
                  const existingIssueComment = issueComments.find((comment) => comment.body?.includes(issueMarker));
                  if (existingIssueComment) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: existingIssueComment.id,
                      body: issueBody,
                    });
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: linkedIssue.number,
                      body: issueBody,
                    });
                  }
                  core.info(`Labelled linked Issue #${linkedIssue.number} for human review.`);
                }
              }

              core.info(`Closed unfixable PR #${prNumber}.`);
              return;
            }

            const runId = context.payload.workflow_run.id;
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 30,
            });

            const failedSteps = [];
            for (const job of jobs.data.jobs) {
              for (const step of (job.steps || [])) {
                if (step.conclusion === 'failure') {
                  failedSteps.push(step.name);
                }
              }
            }

            const failedStepNames = failedSteps.length > 0
              ? failedSteps.join(', ')
              : 'unknown step';

            const feedbackLines = [
              marker,
              '',
              `## Validate generated PR が失敗しました（自動フィードバック #${feedbackComments.length + 1}）`,
              '',
              `失敗ステップ: **${failedStepNames}**`,
              '',
              '以下のルールに従って修正し、再度 push してください:',
              '',
            ];

            if (failedSteps.includes('Validate Markdown structure')) {
              feedbackLines.push(
                '### Markdown 構造エラー',
                '- `summaries/daily/*.md` には `## 注目トピック` と `## テーマ別まとめ` の見出しが必須です',
                '- `drafts/*.md` には `## 今回の要点` または `## 今週の要点` の見出しが必須です',
                '- 1 行は 300 文字以内に収めてください（URL のみの行を除く）。長い場合は文を分割してください',
                '- 「絶対」「必ず成功」「革命的」「最強」「衝撃」「完全無欠」「間違いなく」などの誇張表現は使わないでください',
                '',
              );
            }

            if (failedSteps.includes('Validate changed paths')) {
              feedbackLines.push(
                '### パス制約エラー',
                '- 変更可能なファイルは `summaries/daily/**`, `drafts/**`, `scripts/lib/reporting.mjs` のみです',
                '- それ以外のファイルを変更している場合は revert してください',
                '',
              );
            }

            if (failedSteps.includes('Validate PR metadata')) {
              feedbackLines.push(
                '### PR メタデータエラー',
                '- PR タイトルは `docs: update digest YYYY-MM-DD` 形式にしてください',
                '- PR 本文に `Generated from data/events/YYYY-MM-DD.json` を含めてください',
                '',
              );
            }

            if (failedSteps.includes('Validate reporting mappings')) {
              feedbackLines.push(
                '### reporting.mjs エラー',
                '- `exactMappings` にキーの重複がないか確認してください',
                '',
              );
            }

            if (failedSteps.includes('Validate collect command')) {
              feedbackLines.push(
                '### collect エラー',
                '- `npm run collect` が通るように、入力 JSON と生成 summary の整合を直してください',
                '- 破損した JSON、欠けた必須フィールド、想定外の schema 変更を入れないでください',
                '',
              );
            }

            if (failedSteps.includes('Validate Pages build')) {
              feedbackLines.push(
                '### Pages build エラー',
                '- `npm run build:pages` が通るように修正してください',
                '- 公開 HTML に low-information fallback copy を残さないでください',
                '- `summaries/daily/*.md` と `drafts/*.md` の generic な仮置き文言を、対象更新に即した具体的な運用影響へ書き換えてください',
                '- build-pages.mjs は published output 内の generic fallback を検出すると失敗します',
                '',
              );
            }

            feedbackLines.push(
              `[Validate workflow run](${context.payload.workflow_run.html_url})`,
            );

            const body = feedbackLines.join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                reviewers: ['copilot'],
              });
              core.info(`Re-requested Copilot review for PR #${prNumber} after self-heal feedback.`);
            } catch (error) {
              core.warning(`Could not re-request Copilot reviewer for PR #${prNumber}: ${error.message}`);
            }

            core.info(`Posted self-heal feedback on PR #${prNumber} (attempt ${feedbackComments.length + 1}).`);
