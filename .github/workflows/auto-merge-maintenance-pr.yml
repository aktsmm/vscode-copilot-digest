name: Auto-merge maintenance PR

on:
  workflow_run:
    workflows:
      - Validate maintenance PR
    types:
      - completed

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge the maintenance PR when its changes stay in safe paths
        uses: actions/github-script@v8
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests || [];
            if (pullRequests.length === 0) {
              core.info('No pull request is associated with this workflow run.');
              return;
            }
            const { owner, repo } = context.repo;
            let pr = (await github.rest.pulls.get({ owner, repo, pull_number: pullRequests[0].number })).data;
            const isMaintenance = /^(\[WIP\] )?(maint:|Pipeline maintenance)/i.test(pr.title || '') || (pr.body || '').includes('pipeline-maintenance-request') || (pr.head?.ref || '').startsWith('copilot/pipeline-maintenance');
            if (pr.state !== 'open' || !isMaintenance || !/copilot/i.test(pr.user?.login || '')) {
              core.info(`PR #${pr.number} is not an open Copilot maintenance PR.`);
              return;
            }
            const labels = new Set((pr.labels || []).map((label) => label.name));
            if (labels.has('needs-human-review')) {
              core.info(`PR #${pr.number} requires human review.`);
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            if (files.length === 0) {
              core.info(`PR #${pr.number} has no file changes yet.`);
              return;
            }
            // The validate workflow already ran the guard (scripts/lib/maintenance-guard.mjs) from the base branch;
            // this is the same rule as a second check. Files that control the lane itself always wait for a person.
            const control = new Set(['.github/workflows/pipeline-maintenance.yml', '.github/workflows/validate-maintenance-pr.yml', '.github/workflows/auto-merge-maintenance-pr.yml', '.github/workflows/slide-watchdog.yml', '.github/workflows/deploy-pages.yml', 'scripts/lib/maintenance-guard.mjs', 'scripts/check-maintenance-change.mjs']);
            const safe = /^(scripts\/|tests\/|docs\/|config\/|data\/slides\/[0-9a-f]{16}\.json$|data\/summaries-ja\.json$|\.github\/workflows\/[^/]+\.ya?ml$|\.github\/instructions\/|\.github\/copilot-instructions\.md$|package(-lock)?\.json$|README\.md$|AGENTS\.md$)/;
            const blocked = files.filter((file) => control.has(file.filename) || !safe.test(file.filename) || /(^|\/)\.env/.test(file.filename) || (file.status === 'removed' && file.filename.startsWith('.github/workflows/')));
            if (blocked.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['needs-human-review'] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `Auto-merge stopped: these changes need a person to review them: ${blocked.map((file) => file.filename).join(', ')}`,
              });
              return;
            }
            const date = new Date().toISOString().slice(0, 10);
            if (!/^maint: \d{4}-\d{2}-\d{2}/.test(pr.title)) {
              await github.rest.pulls.update({ owner, repo, pull_number: pr.number, title: `maint: ${date} 点検` });
            }
            if (pr.draft) {
              await github.graphql(
                `mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { number } } }`,
                { id: pr.node_id },
              );
              pr = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
            }
            try {
              await github.graphql(
                `mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number } } }`,
                { id: pr.node_id },
              );
              core.info(`Enabled auto-merge for PR #${pr.number}.`);
            } catch (error) {
              if (!(error.message || '').includes('Pull request is in clean status')) {
                core.warning(`Failed to enable auto-merge for PR #${pr.number}: ${error.message}`);
                return;
              }
              await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'deploy-pages.yml', ref: 'main' });
              core.info(`Merged PR #${pr.number} and dispatched Pages deployment.`);
            }
