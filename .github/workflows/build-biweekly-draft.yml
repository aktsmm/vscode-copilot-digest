name: Build biweekly draft

on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of days to summarize
        required: true
        default: "14"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build draft
        env:
          SUMMARY_DAYS: ${{ inputs.days }}
        run: node scripts/build-biweekly.mjs --days "$SUMMARY_DAYS"

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts
          git commit -m "docs: build biweekly draft"
          git push
