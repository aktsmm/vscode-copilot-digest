name: Notify weekly Discord summary

on:
  schedule:
    - cron: "0 21 * * 2"
  workflow_dispatch:
    inputs:
      date_key:
        description: Target end date (YYYY-MM-DD). Leave blank to use the latest daily event log.
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          if [ -n "${{ inputs.date_key }}" ]; then
            echo "date_key=${{ inputs.date_key }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_file=$(ls data/events/*.json | sort | tail -n 1)
          latest_date=$(basename "$latest_file" .json)
          echo "date_key=$latest_date" >> "$GITHUB_OUTPUT"

      - name: Send weekly Discord summary
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-discord.mjs --mode weekly --date "${{ steps.target.outputs.date_key }}" --window-days 7