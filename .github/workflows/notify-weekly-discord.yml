name: Notify weekly Discord summary

on:
  schedule:
    - cron: "0 21 * * 2"
  workflow_dispatch:
    inputs:
      date_key:
        description: Target end date (YYYY-MM-DD). Leave blank to use the latest daily event log.
        required: false
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve target date
        id: target
        shell: bash
        env:
          TARGET_DATE_KEY: ${{ inputs.date_key }}
        run: |
          if [ -n "$TARGET_DATE_KEY" ]; then
            if [[ ! "$TARGET_DATE_KEY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "date_key must use YYYY-MM-DD" >&2
              exit 1
            fi
            echo "date_key=$TARGET_DATE_KEY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_file=$(ls data/events/*.json | sort | tail -n 1)
          latest_date=$(basename "$latest_file" .json)
          echo "date_key=$latest_date" >> "$GITHUB_OUTPUT"

      - name: Send weekly Discord summary
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATE_KEY: ${{ steps.target.outputs.date_key }}
        run: node scripts/notify-discord.mjs --mode weekly --date "$DATE_KEY" --window-days 7
