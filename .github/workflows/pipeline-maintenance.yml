name: Pipeline maintenance

# Every two weeks a Copilot agent reviews the health of the automation and fixes what it can.
# No model is pinned, so Copilot picks one (Auto). GitHub cron has no biweekly form, so the
# workflow runs weekly and only acts on even ISO weeks (or when started by hand).
on:
  schedule:
    - cron: "0 19 * * 0" # Monday 04:00 JST as a target time; GitHub may delay it
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pipeline-maintenance
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Open a maintenance request and assign Copilot
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const now = new Date();
            const isoWeek = (() => {
              const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
              const day = d.getUTCDay() || 7;
              d.setUTCDate(d.getUTCDate() + 4 - day);
              return Math.ceil(((d - Date.UTC(d.getUTCFullYear(), 0, 1)) / 86400000 + 1) / 7);
            })();
            if (context.eventName === 'schedule' && isoWeek % 2 !== 0) {
              core.info(`ISO week ${isoWeek} is odd; skipping this biweekly run.`);
              return;
            }
            const marker = '<!-- pipeline-maintenance-request -->';
            const title = `Pipeline maintenance request: ${now.toISOString().slice(0, 10)}`;
            const copilotLogins = new Set(['Copilot', 'copilot-swe-agent']);
            const since = new Date(now.getTime() - 14 * 86400000).toISOString();

            // Facts for the agent: what failed, what is waiting, what is skipped.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, status: 'failure', created: `>=${since}`, per_page: 100 });
            const failures = runs.slice(0, 40).map((r) => `- ${r.name} (${r.head_branch}) ${r.created_at.slice(0, 16)} ${r.html_url}`);
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const waiting = open.map((p) => `- #${p.number} ${p.title} [${(p.labels || []).map((l) => l.name).join(', ')}] updated ${p.updated_at.slice(0, 16)}`);
            const skips = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', labels: 'slide-skip', per_page: 100 })).map((i) => `- ${i.title}`);
            const reviewIssues = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'needs-human-review', per_page: 100 })).map((i) => `- #${i.number} ${i.title}`);

            const body = [
              marker,
              '2 週間に 1 度の、自動化パイプラインの点検依頼です。次を順に確認し、直せるものは直してください。',
              '',
              '## 確認すること',
              '1. 下の「直近 14 日の失敗した run」の原因を調べ、同じ失敗が繰り返されないように `scripts/**`・`tests/**`・`docs/**`・`config/**`・`data/slides/**` を直す。',
              '2. 「待機中の PR」と「needs-human-review」のうち、止まっているものの原因を確認する。自動で直せるなら直し、人の判断が要るものは PR の本文に理由と選択肢を書く。',
              '3. `npm test`、`npm run test:e2e`（ブラウザがあれば）、`npm run build:pages`、`npm run validate:slides` が通ることを確認する。',
              '4. スライドの出力（`data/slides`）が `docs/slide-schema.md` の規則を保っているか、サンプルの数件を読んで確認する。',
              '5. 古くなった依存（`package.json`）は、パッチ・マイナー更新だけ検討する。テストが通らなければ更新しない。',
              '',
              '## 守ること',
              '- 変更してよいのは `scripts/**`、`tests/**`、`docs/**`、`config/**`、`data/slides/**` です。`.github/workflows/**` と `package.json` / `package-lock.json` を変える場合は、PR に `needs-human-review` を付けて、人の確認を待ってください（自動 merge されません）。',
              '- Secret の値、パスワード、トークンを、コード・ログ・PR に書かないでください。',
              '- 直すものが無ければ、PR は作らず、この Issue に「対応不要」と確認した内容を書いて閉じてください。',
              '- PR のタイトルは `maint: YYYY-MM-DD 点検` にしてください。変更は小さく、1 つの PR にまとめてください。',
              '',
              `## 直近 14 日の失敗した run（${failures.length} 件）`,
              failures.join('\n') || '- なし',
              '',
              '## 待機中の PR',
              waiting.join('\n') || '- なし',
              '',
              '## needs-human-review の Issue',
              reviewIssues.join('\n') || '- なし',
              '',
              '## スキップ中のスライド更新',
              skips.join('\n') || '- なし',
            ].join('\n');

            const previous = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'pipeline-maintenance', per_page: 100 });
            if (previous.some((i) => !i.pull_request && open.some((p) => String(p.body || '').includes(`#${i.number}`)))) {
              core.info('A maintenance PR is still open; not starting another request.');
              return;
            }
            for (const issue of previous.filter((i) => !i.pull_request)) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: 'Superseded by the next biweekly maintenance request.' });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned' });
            }
            const issue = (await github.rest.issues.create({ owner, repo, title, body, labels: ['copilot', 'pipeline-maintenance'] })).data;

            const ctx = await github.graphql(
              `query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 20) { nodes { login __typename ... on Bot { id } ... on User { id } } }
                }
              }`,
              { owner, repo },
            );
            const actor = (ctx.repository.suggestedActors?.nodes ?? []).find((n) => copilotLogins.has(n.login) && n.id);
            if (!actor) {
              core.warning('Could not resolve the Copilot actor; assign the maintenance issue to Copilot manually.');
              return;
            }
            // No model is requested, so Copilot chooses one itself.
            await github.graphql(
              `mutation($assignableId: ID!, $actorIds: [ID!]!, $targetRepositoryId: ID!, $customInstructions: String!) {
                replaceActorsForAssignable(input: {
                  assignableId: $assignableId,
                  actorIds: $actorIds,
                  agentAssignment: { targetRepositoryId: $targetRepositoryId, baseRef: "main", customInstructions: $customInstructions }
                }) { assignable { ... on Issue { id } } }
              }`,
              {
                assignableId: issue.node_id,
                actorIds: [actor.id],
                targetRepositoryId: ctx.repository.id,
                customInstructions: 'Issue の「守ること」に従い、変更は小さく保ってください。workflow と package.json を変える場合は needs-human-review を付けて止まってください。',
              },
            );
            core.info(`Assigned maintenance issue #${issue.number} to Copilot.`);
