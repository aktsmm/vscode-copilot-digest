name: Pipeline maintenance

# Every week a Copilot agent reviews the health of the automation and fixes what it can, including workflows
# and dependencies (guarded by scripts/lib/maintenance-guard.mjs). No model is pinned, so Copilot picks one (Auto).
on:
  schedule:
    - cron: "0 19 * * 0" # Monday 04:00 JST as a target time; GitHub may delay it
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: pipeline-maintenance
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Open a maintenance request and assign Copilot
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const now = new Date();
            const marker = '<!-- pipeline-maintenance-request -->';
            const title = `Pipeline maintenance request: ${now.toISOString().slice(0, 10)}`;
            const copilotLogins = new Set(['Copilot', 'copilot-swe-agent']);
            const since = new Date(now.getTime() - 14 * 86400000).toISOString();

            // Facts for the agent: what failed, what is waiting, what is skipped.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, status: 'failure', created: `>=${since}`, per_page: 100 });
            const failures = runs.slice(0, 40).map((r) => `- ${r.name} (${r.head_branch}) ${r.created_at.slice(0, 16)} ${r.html_url}`);
            const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const waiting = open.map((p) => `- #${p.number} ${p.title} [${(p.labels || []).map((l) => l.name).join(', ')}] updated ${p.updated_at.slice(0, 16)}`);
            const skips = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', labels: 'slide-skip', per_page: 100 })).map((i) => `- ${i.title}`);
            const reviewIssues = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'needs-human-review', per_page: 100 })).map((i) => `- #${i.number} ${i.title}`);
            // Blocked work: Copilot PRs closed without merging, and Copilot issues that have no PR after two days.
            const recentPulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 50 });
            const closedUnmerged = recentPulls
              .filter((p) => !p.merged_at && /copilot/i.test(p.user?.login || '') && p.closed_at >= since)
              .map((p) => `- #${p.number} ${p.title} (closed ${p.closed_at.slice(0, 16)})`);
            const openIssues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'copilot', per_page: 100 });
            const prText = (p) => `${p.title}\n${p.body || ''}`;
            const stalledIssues = openIssues
              .filter((i) => !i.pull_request && Date.now() - Date.parse(i.created_at) > 2 * 86400000 && !open.some((p) => prText(p).includes(`#${i.number}`)))
              .map((i) => `- #${i.number} ${i.title} (opened ${i.created_at.slice(0, 16)})`);

            // Hosts the agent firewall blocked (named in its PR warnings) are added to the allowlist, within known publishers.
            const trusted = /(^|\.)(github\.com|githubusercontent\.com|githubassets\.com|github\.blog|visualstudio\.com|vscode\.dev|microsoft\.com|azure\.com|publickey1\.jp)$/i;
            const blockedHosts = new Set();
            for (const p of [...open, ...recentPulls].filter((x) => /copilot/i.test(x.user?.login || ''))) {
              const text = String(p.body || '');
              const at = text.search(/blocked (me|by firewall)/i);
              if (at < 0) continue;
              for (const m of text.slice(at, at + 3000).matchAll(/`(?:https?:\/\/)?([a-z0-9][a-z0-9.-]*\.[a-z]{2,})(?:[/:][^`]*)?`/gi)) {
                if (trusted.test(m[1])) blockedHosts.add(m[1].toLowerCase());
              }
            }
            let allowlistNote = '- なし';
            if (blockedHosts.size > 0) {
              try {
                const envName = 'copilot';
                const name = 'COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS';
                const repoId = (await github.rest.repos.get({ owner, repo })).data.id;
                let current = '';
                try { current = (await github.request('GET /repositories/{id}/environments/{env}/variables/{name}', { id: repoId, env: envName, name })).data.value || ''; } catch { /* not set yet */ }
                const merged = [...new Set([...current.split(',').map((s) => s.trim()).filter(Boolean), ...blockedHosts])];
                if (merged.length !== current.split(',').filter(Boolean).length) {
                  await github.request(current ? 'PATCH /repositories/{id}/environments/{env}/variables/{name}' : 'POST /repositories/{id}/environments/{env}/variables', { id: repoId, env: envName, name, value: merged.join(',') });
                }
                allowlistNote = `- 許可リストに追加または確認済み: ${[...blockedHosts].join(', ')}`;
              } catch (error) {
                core.warning(`Could not update the firewall allowlist: ${error.message}`);
                allowlistNote = `- 許可リストへの追加に失敗（要手動対応）: ${[...blockedHosts].join(', ')}`;
              }
            }

            const body = [
              marker,
              '週 1 回の、自動化パイプラインの点検依頼です。止まっている流れの原因を調べて直し、再び自動で回る状態にしてください。権限は広く与えてあり、自動 merge されます。',
              '',
              '## やること（順に）',
              '1. 下の「直近 14 日の失敗した run」と「merge されずに閉じた Copilot の PR」「PR が付かないまま止まった Copilot の Issue」の原因を調べ、同じ失敗が繰り返されないように直す。ブロックされる原因（agent のファイアウォール、確認できない URL、レーンの誤判定、検証の失敗）は、根本から直す。',
              '2. 「待機中の PR」と「needs-human-review」のうち、止まっているものを、直せるなら直して前に進める。人の判断が要るものだけ、PR 本文に理由と選択肢を書く。',
              '3. `npm test`、`npm run test:e2e`（ブラウザがあれば）、`npm run build:pages`、`npm run validate:slides`、`npm run validate:summaries` が通ることを確認する。',
              '4. スライド（`data/slides`）と要約（`data/summaries-ja.json`）の文面を数件読み、規則（`docs/slide-schema.md`）と具体性を保っているか確認する。定型文が増えていれば原因を直す。',
              '5. `node scripts/coverage-report.mjs` を実行し、フィードに出ているのに `data/events` に無い記事が 0 件か確認する。残っていれば `node scripts/backfill-skipped.mjs --coverage` で戻し、原因を `scripts/**` で直す。',
              '6. 古くなった依存（`package.json`）は、パッチ・マイナー更新を進める。テストが通らなければ更新しない。',
              '7. 新しいパターンの失敗を見つけたら、再発しないように、テストか実行時のガードを足す。',
              '',
              '## 変更してよい範囲',
              '- `scripts/**`、`tests/**`、`docs/**`、`config/**`、`data/slides/**`、`data/summaries-ja.json`、`.github/workflows/**`（下の例外を除く）、`.github/instructions/**`、`package.json` / `package-lock.json`、`README.md`、`AGENTS.md`。',
              '- 例外（変えないでください。変えると自動 merge されず、人の確認待ちになります）: `.github/workflows/pipeline-maintenance.yml`、`validate-maintenance-pr.yml`、`auto-merge-maintenance-pr.yml`、`slide-watchdog.yml`、`deploy-pages.yml`、`scripts/lib/maintenance-guard.mjs`、`scripts/check-maintenance-change.mjs`。',
              '- workflow では、新しい secret の参照、`write-all`、`pull_request_target` の追加、ダウンロードをシェルへ流し込む処理は禁止です。workflow の削除もできません。',
              '- Secret の値、パスワード、トークンを、コード・ログ・PR に書かないでください。',
              '- 直すものが無ければ、PR は作らず、この Issue に「対応不要」と確認した内容を書いて閉じてください。',
              '- PR のタイトルは `maint: YYYY-MM-DD 点検` にし、本文の先頭に `<!-- pipeline-maintenance-request -->` を入れてください。変更は 1 つの PR にまとめてください。',
              '- workflow への push が許可されず直せなかった場合は、必要な変更を PR 本文に書き、`needs-human-review` を付けてください。',
              '',
              `## 直近 14 日の失敗した run（${failures.length} 件）`,
              failures.join('\n') || '- なし',
              '',
              `## merge されずに閉じた Copilot の PR（${closedUnmerged.length} 件）`,
              closedUnmerged.join('\n') || '- なし',
              '',
              `## PR が付かないまま止まった Copilot の Issue（${stalledIssues.length} 件）`,
              stalledIssues.join('\n') || '- なし',
              '',
              '## 待機中の PR',
              waiting.join('\n') || '- なし',
              '',
              '## needs-human-review の Issue',
              reviewIssues.join('\n') || '- なし',
              '',
              '## agent のファイアウォールがブロックした host',
              allowlistNote,
              '',
              '## スキップ中のスライド更新',
              skips.join('\n') || '- なし',
            ].join('\n');

            const previous = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'pipeline-maintenance', per_page: 100 });
            if (previous.some((i) => !i.pull_request && open.some((p) => String(p.body || '').includes(`#${i.number}`)))) {
              core.info('A maintenance PR is still open; not starting another request.');
              return;
            }
            for (const issue of previous.filter((i) => !i.pull_request)) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: 'Superseded by the next weekly maintenance request.' });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned' });
            }
            const issue = (await github.rest.issues.create({ owner, repo, title, body, labels: ['copilot', 'pipeline-maintenance'] })).data;

            const ctx = await github.graphql(
              `query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  id
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 20) { nodes { login __typename ... on Bot { id } ... on User { id } } }
                }
              }`,
              { owner, repo },
            );
            const actor = (ctx.repository.suggestedActors?.nodes ?? []).find((n) => copilotLogins.has(n.login) && n.id);
            if (!actor) {
              core.warning('Could not resolve the Copilot actor; assign the maintenance issue to Copilot manually.');
              return;
            }
            // No model is requested, so Copilot chooses one itself.
            await github.graphql(
              `mutation($assignableId: ID!, $actorIds: [ID!]!, $targetRepositoryId: ID!, $customInstructions: String!) {
                replaceActorsForAssignable(input: {
                  assignableId: $assignableId,
                  actorIds: $actorIds,
                  agentAssignment: { targetRepositoryId: $targetRepositoryId, baseRef: "main", customInstructions: $customInstructions }
                }) { assignable { ... on Issue { id } } }
              }`,
              {
                assignableId: issue.node_id,
                actorIds: [actor.id],
                targetRepositoryId: ctx.repository.id,
                customInstructions: 'Issue の「守ること」に従い、変更は小さく保ってください。workflow と package.json を変える場合は needs-human-review を付けて止まってください。',
              },
            );
            core.info(`Assigned maintenance issue #${issue.number} to Copilot.`);
