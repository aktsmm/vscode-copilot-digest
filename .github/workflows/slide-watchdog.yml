name: Slide lane watchdog

# Keeps the slide pipeline moving on its own: clears stalled Copilot requests, isolates items it cannot
# author, nudges failing PRs, retries a failed Pages deploy and restarts the lane when it goes quiet.
# Times are targets; GitHub schedules can drift.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: slide-watchdog
  cancel-in-progress: false

jobs:
  token-health:
    runs-on: ubuntu-latest
    steps:
      - name: Warn before the Copilot token expires
        uses: actions/github-script@v8
        env:
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        with:
          # The built-in token opens the warning, so it works even when the personal token is dead.
          script: |
            const { owner, repo } = context.repo;
            const token = process.env.COPILOT_ASSIGN_TOKEN || '';
            let problem = null;
            if (!token) {
              problem = { title: 'COPILOT_ASSIGN_TOKEN is not set', detail: 'The Copilot agent lanes (slides, digest, maintenance) cannot start. Slides are still authored by the GitHub Models fallback.' };
            } else {
              const response = await fetch('https://api.github.com/user', { headers: { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json' } });
              const expires = response.headers.get('github-authentication-token-expiration');
              const days = expires ? (Date.parse(expires) - Date.now()) / 86400000 : null;
              if (response.status === 401) {
                problem = { title: 'COPILOT_ASSIGN_TOKEN is invalid or expired', detail: 'Create a new token (repo and workflow scopes, plus Copilot access) and run `gh secret set COPILOT_ASSIGN_TOKEN`.' };
              } else if (days !== null && days < 21) {
                problem = { title: `COPILOT_ASSIGN_TOKEN expires in ${Math.max(0, Math.floor(days))} days`, detail: `It expires on ${expires}. Create a new token before then and run \`gh secret set COPILOT_ASSIGN_TOKEN\`.` };
              } else {
                core.info(`Token is healthy (expires: ${expires || 'never'}).`);
              }
            }
            if (!problem) return;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'token-health', per_page: 100 });
            if (open.length > 0) { core.info('A token warning is already open.'); return; }
            await github.rest.issues.create({
              owner, repo, title: problem.title, labels: ['token-health'],
              body: `${problem.detail}\n\nUntil it is replaced, the slide lane keeps running through the GitHub Models fallback (\`author-slide-fallback.yml\`), but the Copilot agent lanes are paused.`,
            });
            core.warning(problem.title);
  watch:
    needs: token-health
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Repair the slide lane
        uses: actions/github-script@v8
        with:
          # A user token is needed so a comment on Copilot's PR counts as a user request.
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const mins = (value) => (Date.now() - Date.parse(value)) / 60000;
            const isCopilot = (pr) => /copilot/i.test(pr.user?.login || '');
            const isSlideLane = (pr) =>
              /^(\[WIP\] )?(slides:|Slide authoring request)|slide authoring/i.test(pr.title || '') ||
              String(pr.body || '').includes('slide-authoring-request') ||
              (pr.head?.ref || '').startsWith('copilot/slide-');
            const dispatchAuthor = async (inputs) => {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'author-slide-pr.yml', ref: 'main', inputs });
              core.info(`Dispatched author-slide-pr.yml ${JSON.stringify(inputs)}`);
            };

            let restart = null;

            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            for (const pr of pulls.filter((p) => isCopilot(p) && isSlideLane(p))) {
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
              const age = mins(pr.updated_at);
              const labels = new Set((pr.labels || []).map((l) => l.name));
              const issueNumber = Number((String(pr.body || '').match(/(?:Fixes|Closes|Resolves)\s+(?:[\w.-]+\/[\w.-]+)?#(\d+)/i) || [])[1] || 0);

              const closeRequest = async (reason) => {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `Closed by the slide lane watchdog: ${reason}` });
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
                if (issueNumber) {
                  await github.rest.issues.update({ owner, repo, issue_number: issueNumber, state: 'closed', state_reason: 'not_planned' });
                }
              };

              if (files.length === 0 && age > 120) {
                // Copilot stopped without changing anything (for example, it could not verify a source).
                let ids = [];
                if (issueNumber) {
                  const issue = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
                  ids = [...new Set([...String(issue.data.body || '').matchAll(/"id":\s*"([0-9a-f]{16})"/g)].map((m) => m[1]))];
                }
                await closeRequest(`no slide files after ${Math.round(age)} minutes`);
                if (ids.length === 1) {
                  // A single item that cannot be authored is skipped from now on.
                  await github.rest.issues.create({
                    owner, repo, title: `Slide skip: ${ids[0]}`, labels: ['slide-skip'],
                    body: `Copilot could not author this update on its own (see #${pr.number}). It is skipped by the authoring workflow. Close this issue and delete the label to retry.`,
                  }).then((created) => github.rest.issues.update({ owner, repo, issue_number: created.data.number, state: 'closed', state_reason: 'not_planned' }));
                  restart = { limit: '5' };
                } else {
                  // Narrow the next request to one update, so a bad item only blocks itself.
                  restart = { limit: '1' };
                }
                continue;
              }

              if (files.length > 0 && age > 30) {
                const checks = await github.rest.checks.listForRef({ owner, repo, ref: pr.head.sha, per_page: 100 });
                const failed = checks.data.check_runs.filter((c) => c.conclusion === 'failure');
                if (failed.length > 0) {
                  const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
                  const nudges = comments.filter((c) => c.body.includes('<!-- slide-watchdog-nudge -->'));
                  if (nudges.some((c) => c.body.includes(pr.head.sha))) continue;
                  if (nudges.length >= 2) {
                    await closeRequest('validation kept failing after two reminders');
                    restart = { limit: '1' };
                    continue;
                  }
                  await github.rest.issues.createComment({
                    owner, repo, issue_number: pr.number,
                    body: `<!-- slide-watchdog-nudge -->\n@copilot Validation failed on ${pr.head.sha}. Run \`npm run validate:slides\`, fix every reported problem in the changed \`data/slides/*.json\` files only, and push. Follow \`docs/slide-schema.md\`.`,
                  });
                  continue;
                }
              }

              if (labels.has('needs-human-review') && age > 1440) {
                await closeRequest('waited more than a day for human review');
                restart = { limit: '1' };
              }
            }

            // A failed Pages deploy that nobody retried.
            const deploys = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'deploy-pages.yml', branch: 'main', per_page: 3 })).data.workflow_runs;
            const latestDeploy = deploys[0];
            if (latestDeploy && latestDeploy.status === 'completed' && latestDeploy.conclusion === 'failure' && mins(latestDeploy.updated_at) > 20) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'deploy-pages.yml', ref: 'main' });
              core.info('Re-dispatched the failed Pages deploy.');
            }

            // The lane went quiet: no authoring run for ten days.
            if (!restart) {
              const runs = (await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'author-slide-pr.yml', per_page: 1 })).data.workflow_runs;
              if (!runs[0] || mins(runs[0].created_at) > 14400) restart = { limit: '5' };
            }
            if (restart) await dispatchAuthor(restart);
