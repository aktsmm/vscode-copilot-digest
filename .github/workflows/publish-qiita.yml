name: Publish Qiita article

on:
  workflow_dispatch:
    inputs:
      file:
        description: Draft path relative to repository root
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      QIITA_ACCESS_TOKEN: ${{ secrets.QIITA_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish article
        run: node scripts/publish-qiita.mjs "${{ inputs.file }}"

      - name: Commit metadata changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.file }}"
          git commit -m "docs: update Qiita publication metadata"
          git push
