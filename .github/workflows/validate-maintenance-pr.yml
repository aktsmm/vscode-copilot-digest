name: Validate maintenance PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Only the weekly maintenance lane; other lanes have their own validators.
    if: startsWith(github.event.pull_request.title, 'maint:') || contains(github.event.pull_request.body, 'pipeline-maintenance-request') || startsWith(github.event.pull_request.head.ref, 'copilot/pipeline-maintenance')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # The check runs the base branch copy of the guard, so the PR cannot weaken it.
      - name: Check the change stays within what maintenance may touch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" > "$RUNNER_TEMP/files.json"
          node -e "const fs=require(\"fs\");const p=process.argv[1];const t=fs.readFileSync(p,\"utf8\").replace(/\]\s*\[/g,\",\");fs.writeFileSync(p,t)" "$RUNNER_TEMP/files.json"
          mkdir -p "$RUNNER_TEMP/guard/scripts/lib"
          git show "origin/${BASE_REF}:scripts/check-maintenance-change.mjs" > "$RUNNER_TEMP/guard/scripts/check-maintenance-change.mjs"
          git show "origin/${BASE_REF}:scripts/lib/maintenance-guard.mjs" > "$RUNNER_TEMP/guard/scripts/lib/maintenance-guard.mjs"
          echo '{"type":"module"}' > "$RUNNER_TEMP/guard/package.json"
          node "$RUNNER_TEMP/guard/scripts/check-maintenance-change.mjs" "$RUNNER_TEMP/files.json"

      - name: Every workflow still parses
        run: |
          python3 - <<'PY'
          import glob, yaml
          for path in glob.glob(".github/workflows/*.y*ml"):
              yaml.safe_load(open(path, encoding="utf-8"))
          print("workflows parse")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate slides
        run: npm run validate:slides

      - name: Validate summaries
        run: npm run validate:summaries

      - name: Validate data tests
        run: npm run test:data

      - name: Validate Pages build
        run: npm run build:pages

      - name: Validate Pages UX
        run: npm run test:pages
