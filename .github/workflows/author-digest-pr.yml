name: Author digest PR

on:
  workflow_run:
    workflows:
      - Collect updates
    types:
      - completed
  workflow_dispatch:
    inputs:
      date_key:
        description: Target date (YYYY-MM-DD). Leave blank to use the latest event log.
        required: false
        type: string
      scope:
        description: Requested authoring scope.
        required: false
        default: full
        type: choice
        options:
          - daily
          - highlights-and-drafts
          - full
      force_issue:
        description: Create or update the issue even if the latest run has 0 new events.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  author-request:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Prepare digest target
        id: target
        uses: actions/github-script@v8
        env:
          MANUAL_DATE_KEY: ${{ inputs.date_key }}
          MANUAL_SCOPE: ${{ inputs.scope }}
          FORCE_ISSUE: ${{ inputs.force_issue }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const eventsDir = path.join(process.env.GITHUB_WORKSPACE, 'data', 'events');
            const files = fs.readdirSync(eventsDir)
              .filter((file) => file.endsWith('.json'))
              .sort();
            const isManual = context.eventName === 'workflow_dispatch';
            const requestedDateKey = isManual ? (process.env.MANUAL_DATE_KEY || '').trim() : '';
            const requestedScope = (isManual ? process.env.MANUAL_SCOPE : 'full') || 'full';
            const forceIssue = isManual && process.env.FORCE_ISSUE === 'true';

            if (files.length === 0) {
              core.setOutput('should_run', 'false');
              return;
            }

            const latestFile = files[files.length - 1];
            const selectedFile = requestedDateKey
              ? `${requestedDateKey}.json`
              : latestFile;

            if (!files.includes(selectedFile)) {
              core.setFailed(`Event log not found: ${selectedFile}`);
              return;
            }

            const dateKey = selectedFile.replace(/\.json$/, '');
            const eventLog = JSON.parse(
              fs.readFileSync(path.join(eventsDir, selectedFile), 'utf8'),
            );
            const newEventsCount = Number(eventLog.latestRun?.newEventsCount ?? 0);
            const summaryFile = path.join(
              process.env.GITHUB_WORKSPACE,
              'summaries',
              'daily',
              `${dateKey}.md`,
            );
            const genericFallbackMarkers = [
              'GitHub Copilot 関連の更新。運用や導入判断に関わる変更点を原文で確認しておきたい。',
              'Visual Studio Code 関連の更新。日々の開発フローや agent 利用に効く変更点を確認しておきたい。',
              '英語ソースの更新。公開内容の変化や運用への影響を原文で確認しておきたい。',
              '継続ウォッチ対象として押さえておきたい更新です。',
            ];
            const summaryText = fs.existsSync(summaryFile)
              ? fs.readFileSync(summaryFile, 'utf8')
              : '';
            const fallbackMatches = genericFallbackMarkers.filter((marker) =>
              summaryText.includes(marker),
            );
            const hasGenericFallback = fallbackMatches.length > 0;
            const shouldAuthor = newEventsCount > 0 || forceIssue || hasGenericFallback;

            if (!shouldAuthor) {
              core.info(`No new events in ${selectedFile}.`);
              core.setOutput('should_run', 'false');
              return;
            }

            const triggerReasons = [];
            if (newEventsCount > 0) {
              triggerReasons.push(`最新 run で ${newEventsCount} 件の新規更新を検知`);
            }
            if (hasGenericFallback) {
              triggerReasons.push(`日次 summary に定型 fallback が ${fallbackMatches.length} 件残存`);
            }
            if (forceIssue) {
              triggerReasons.push('手動で force_issue=true を指定');
            }
            const triggerReason = triggerReasons.join(' / ');

            const scopeLabelMap = {
              daily: 'summaries/daily のみ',
              'highlights-and-drafts': 'summaries/daily と drafts の要点',
              full: 'summaries/daily と drafts 全体と reporting.mjs',
            };
            const requestedScopeLabel = scopeLabelMap[requestedScope] ?? scopeLabelMap.full;
            const prTitleRule = `docs: update digest ${dateKey}`;

            const highlights = (eventLog.events ?? [])
              .slice(0, 5)
              .map((event, index) => `${index + 1}. ${event.title}\n   - ${event.url}`)
              .join('\n');

            const body = [
              '## 日次ダイジェスト自動更新依頼',
              '',
              '本日の更新データを基に、GitHub.com 上で本文・要約・必要な対訳追加を行い、PR を作成してください。',
              '',
              '### 対象',
              `- イベントデータ: \`data/events/${dateKey}.json\``,
              `- 日次本文: \`summaries/daily/${dateKey}.md\``,
              '- 必要に応じて週次/隔週ドラフト: `drafts/**`',
              '- 必要に応じて対訳追加: `scripts/lib/reporting.mjs`',
              '',
              '### 起票理由',
              `- ${triggerReason}`,
              ...(hasGenericFallback
                ? fallbackMatches.map((marker) => `- fallback: ${marker}`)
                : []),
              '',
              '### やってほしいこと',
              `1. \`data/events/${dateKey}.json\` を読み、重要な更新を把握する`,
              `2. \`summaries/daily/${dateKey}.md\` の \`注目トピック\` と \`テーマ別まとめ\` を更新する`,
              '3. 今週分・隔週分のドラフト対象期間に含まれる場合は、`drafts/**` の要点または本文を更新する',
              '4. `reporting.mjs` に未登録のタイトルや要約パターンが必要なら追加する',
              '5. 変更を 1 つの PR として作成する',
              '',
              '### 文章ルール',
              '- 日本語で簡潔に書く',
              '- 1 項目ごとに「何が変わったか」と「運用上なぜ気にするか」を含める',
              '- 根拠のない断定や誇張をしない',
              '- 元ソースにない数値や固有名詞を足さない',
              '- 既存の文体とセクション構成を崩さない',
              '',
              '### 制約',
              '- `data/**` の生データは変更しない',
              '- 許可された変更対象以外は触らない',
              '- `npm run collect` と `npm run build:pages` が通る状態を維持する',
              '- 不確実な場合は `needs-human-review` を明記して PR を作る',
              '',
              '### 依頼スコープ',
              `- 選択: ${requestedScopeLabel}`,
              '',
              '### PR ルール',
              `- PR タイトルは \`${prTitleRule}\` を基本形にする`,
              `- PR 本文には \`Generated from data/events/${dateKey}.json\` を含める`,
              '- 根拠が弱い場合や許可外変更が必要な場合は `needs-human-review` を付けて止める',
              '',
              '### 直近の候補',
              highlights || '- なし',
            ].join('\n');

            core.setOutput('should_run', 'true');
            core.setOutput('date_key', dateKey);
            core.setOutput('pr_title_rule', prTitleRule);
            core.setOutput('issue_title', `Digest authoring request: ${dateKey}`);
            core.setOutput('issue_body', body);

      - name: Create or update authoring issue
        id: create_or_update_authoring_issue
        if: steps.target.outputs.should_run == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const marker = '<!-- copilot-author-request -->';
            const repoSlug = `${context.repo.owner}/${context.repo.repo}`;
            const title = process.env.ISSUE_TITLE;
            const body = process.env.ISSUE_BODY;
            const labels = ['copilot', 'digest-authoring', 'auto-pr'];
            const copilotLogins = new Set(['Copilot', 'copilot-swe-agent']);
            const assignmentInstructions = [
              'PR タイトルと本文は Issue のルールに合わせてください。',
              '不確実な場合は needs-human-review を付けて停止してください。',
              '許可された変更対象以外は触らないでください。',
            ].join('\n');
            let assignmentStatus = 'not-attempted';
            let assignmentDetail = '';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'digest-authoring',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);

            let issueNumber;
            let createdNewIssue = false;
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              issueNumber = existing.number;
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
              });
              issueNumber = created.data.number;
              createdNewIssue = true;
            }

            const currentIssue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            if (!createdNewIssue) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels,
              });
            }

            try {
              const assignmentContext = await github.graphql(
                `query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    id
                    suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 20) {
                      nodes {
                        login
                        __typename
                        ... on Bot {
                          id
                        }
                        ... on User {
                          id
                        }
                      }
                    }
                  }
                }`,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                },
              );

              const issueId = currentIssue.data.node_id;
              const repositoryId = assignmentContext.repository.id;
              const existingAssignees = currentIssue.data.assignees ?? [];
              const copilotActor = (assignmentContext.repository.suggestedActors?.nodes ?? []).find(
                (actor) => copilotLogins.has(actor.login) && actor.id,
              );

              if (!issueId || !repositoryId || !copilotActor?.id) {
                assignmentStatus = 'manual-required';
                assignmentDetail = 'Copilot actor ID を取得できませんでした。';
                core.warning('Could not resolve the Copilot actor ID for automatic issue assignment.');
              } else if (existingAssignees.some((assignee) => copilotLogins.has(assignee.login))) {
                assignmentStatus = 'already-assigned';
                assignmentDetail = 'Issue にはすでに Copilot が割り当てられています。';
              } else if (!existingAssignees.some((assignee) => copilotLogins.has(assignee.login))) {
                await github.graphql(
                  `mutation($assignableId: ID!, $actorIds: [ID!]!, $targetRepositoryId: ID!, $customInstructions: String!) {
                    replaceActorsForAssignable(input: {
                      assignableId: $assignableId,
                      actorIds: $actorIds,
                      agentAssignment: {
                        targetRepositoryId: $targetRepositoryId,
                        baseRef: "main",
                        customInstructions: $customInstructions,
                      }
                    }) {
                      assignable {
                        ... on Issue {
                          id
                          assignees(first: 10) {
                            nodes {
                              login
                            }
                          }
                        }
                      }
                    }
                  }`,
                  {
                    assignableId: issueId,
                    actorIds: [copilotActor.id],
                    targetRepositoryId: repositoryId,
                    customInstructions: assignmentInstructions,
                  },
                );
                assignmentStatus = 'assigned';
                assignmentDetail = 'Workflow から Copilot assignment を実行しました。';
              }
            } catch (error) {
              assignmentStatus = 'manual-required';
              assignmentDetail = error.message;
              core.warning(`Failed to assign the issue to Copilot via GraphQL: ${error.message}`);
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const commentBody = [
              marker,
              'Copilot への assignment を workflow から試行しました。',
              assignmentStatus === 'assigned'
                ? '- 自動 assignment: 成功'
                : assignmentStatus === 'already-assigned'
                  ? '- 自動 assignment: 既に割り当て済み'
                  : '- 自動 assignment: 失敗。手動フォールバックを使ってください。',
              assignmentDetail ? `- 詳細: ${assignmentDetail}` : null,
              '- 追加の task 指示は assignment 時の agentAssignment に渡します。',
              '- 手動フォールバック: Issue 右サイドバーの Assign to Agent を開き、この repository を選んで Assign を押してください。',
              `- Repository selector: ${repoSlug}`,
              '- Optional prompt は空でも構いません。必要なら issue 本文のルールをそのまま追加してください。',
              '- 10 分以内に PR が出ない場合は、assignment 状態と Copilot cloud agent 設定を確認してください。',
              '- このコメントは通知と監査用です。',
            ].filter(Boolean).join('\n');

            const existingMarkerComment = comments.find((comment) => comment.body?.includes(marker));

            if (existingMarkerComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingMarkerComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody,
              });
            }

            core.setOutput('issue_number', String(issueNumber));
        env:
          ISSUE_TITLE: ${{ steps.target.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.target.outputs.issue_body }}

      - name: Shepherd generated PR
        if: steps.target.outputs.should_run == 'true'
        uses: actions/github-script@v8
        env:
          DATE_KEY: ${{ steps.target.outputs.date_key }}
          PR_TITLE_RULE: ${{ steps.target.outputs.pr_title_rule }}
          ISSUE_NUMBER: ${{ steps.create_or_update_authoring_issue.outputs.issue_number }}
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const dateKey = process.env.DATE_KEY;
            const prTitleRule = process.env.PR_TITLE_RULE;
            const issueNumber = Number(process.env.ISSUE_NUMBER || '0');
            const workflowNames = [
              'Request Copilot review',
              'Validate generated PR',
              'Auto-merge generated PR',
            ];
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const cutoff = Date.now() - 60 * 60 * 1000;
            const maxAttempts = 3;
            const sourceMarker = `Generated from data/events/${dateKey}.json`;

            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const targetWorkflows = workflows.filter((workflow) => workflowNames.includes(workflow.name));

            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const pr = openPulls.find((pull) =>
                /copilot/i.test(pull.user?.login || '') &&
                (
                  (pull.title || '').includes(dateKey) ||
                  (pull.head?.ref || '').includes(dateKey) ||
                  String(pull.body || '').includes(`#${issueNumber}`) ||
                  String(pull.body || '').includes(`Digest authoring request: ${dateKey}`)
                ),
              );

              if (!pr) {
                if (issue.data.state === 'closed') {
                  core.info(`Issue #${issueNumber} is already closed; stopping shepherd loop.`);
                  return;
                }
                core.info(`Attempt ${attempt}: generated PR not visible yet.`);
                await sleep(20000);
                continue;
              }

              const currentPr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              let livePr = currentPr.data;

              const normalizedTitle = /^docs: update digest \d{4}-\d{2}-\d{2}(?: \+ drafts)?(?: \+ reporting)?$/.test(livePr.title || '')
                ? livePr.title
                : prTitleRule;
              const normalizedBody = String(livePr.body || '').includes(sourceMarker)
                ? String(livePr.body || '')
                : `${sourceMarker}\n\n${String(livePr.body || '').trim()}`.trim();

              if (normalizedTitle !== livePr.title || normalizedBody !== String(livePr.body || '')) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  title: normalizedTitle,
                  body: normalizedBody,
                });
                core.info(`Attempt ${attempt}: normalized PR #${pr.number} metadata.`);
                const refreshedPr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                livePr = refreshedPr.data;
              }

              if (livePr.state !== 'open') {
                core.info(`PR #${pr.number} is already closed.`);
                return;
              }

              let rerunCount = 0;
              for (const workflow of targetWorkflows) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.id,
                  per_page: 20,
                });

                for (const run of runs) {
                  const createdAt = Date.parse(run.created_at || 0);
                  const isRecent = Number.isFinite(createdAt) && createdAt >= cutoff;
                  const isRetryable = run.conclusion === 'action_required' || run.conclusion === 'failure';
                  const canRetry = Number(run.run_attempt ?? 0) < maxAttempts;
                  const isTargetPr = (run.pull_requests || []).some((pullRef) => pullRef.number === pr.number);
                  const actorLogin = run.actor?.login || run.triggering_actor?.login || '';
                  const isCopilotActor = /copilot/i.test(actorLogin);

                  if (!isRecent || !isRetryable || !canRetry || !isTargetPr || !isCopilotActor) {
                    continue;
                  }

                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                  });
                  rerunCount += 1;
                  core.info(`Attempt ${attempt}: reran blocked workflow run ${run.id} (${workflow.name}).`);
                }
              }

              if (rerunCount === 0) {
                const refreshedIssue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                if (refreshedIssue.data.state === 'closed') {
                  core.info(`Issue #${issueNumber} closed automatically; shepherd loop finished.`);
                  return;
                }
                core.info(`Attempt ${attempt}: no blocked runs found for PR #${pr.number}.`);
              }

              await sleep(20000);
            }

            core.warning(`Generated PR for ${dateKey} did not fully settle within the shepherd window.`);
