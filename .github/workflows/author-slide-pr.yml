name: Author slides

on:
  schedule:
    - cron: "0 18 * * 0,3" # Mon / Thu 03:00 JST as a target time; GitHub may delay it
  workflow_dispatch:
    inputs:
      refresh:
        description: Also re-author slides that lack the detail blocks (audience etc.)
        type: boolean
        default: false
      ids:
        description: Comma-separated update ids to author or refresh (overrides the period)
        default: ""
      limit:
        description: Maximum number of updates per request
        default: "10"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: author-slides
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API data
        run: npm run build:pages

      - name: List updates without slides
        id: pending
        env:
          LIMIT: ${{ inputs.limit || '10' }}
          REFRESH: ${{ inputs.refresh && '--refresh' || '' }}
          IDS: ${{ inputs.ids }}
        run: |
          if [ -n "$IDS" ]; then
            node scripts/pending-slides.mjs --ids "$IDS" --limit "$LIMIT" $REFRESH > pending.json
          else
            node scripts/pending-slides.mjs --months 3 --limit "$LIMIT" $REFRESH > pending.json
          fi
          count="$(node -e "console.log(JSON.parse(require('fs').readFileSync('pending.json','utf8')).length)")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create or update the authoring issue and assign Copilot
        if: steps.pending.outputs.count != '0'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          script: |
            const fs = require('fs');
            const pending = JSON.parse(fs.readFileSync('pending.json', 'utf8'));
            const title = 'Slide authoring request';
            const labels = ['copilot', 'slide-authoring'];
            const copilotLogins = new Set(['Copilot', 'copilot-swe-agent']);
            const body = [
              '<!-- slide-authoring-request -->',
              '以下の更新ごとに 1 枚のスライド JSON を `data/slides/{id}.json` として追加してください。',
              '',
              '## ルール',
              '- 変更してよいのは `data/slides/{id}.json` の追加と、同じファイルの上書きだけです。コード・workflow・設定・他のデータは変更しないでください。',
              '- 形式は `schema: "vscode-copilot-digest/slide/v2"` です。項目・上限・規則は `docs/slide-schema.md`、手本は `examples/slide-deck.sample.json`、検証は `npm run validate:slides` です。通ることを確認してから PR にしてください。',
              '- 下の対象には、サイトが持つ題名・URL・候補の資料しか入れていません。内容は記事そのものを読んで書いてください（こちらの要約は渡していません）。',
              '- 各更新について、対象の `source` URL の記事そのものと、そこからリンクされている公式ドキュメントを実際に開いて読み、書かれていることだけを日本語でまとめてください。数値・製品名・プラン名・日付を補わないでください。',
              '- 1 枚で読み切れる構成にします: `title.ja`（80 文字以内、名詞止め）、`title.subtitleJa`（要点を 1 行）、`title.original`（記事の英語タイトル）、`audience`（誰に関係するか / 何が変わるか）、`action`（要対応・任意・対応不要・情報のどれか）、`panels`（1〜4 枚。`core` の「使える場所とプラン」「使い方」「前提と制限」など、`detail` の「注意点」など）、`glossary`（記事・ドキュメントに定義がある語だけ、最大 6 語）、`suggestions`（任意、最大 3 件）。',
              '- `references.source` は `{ "title": ..., "url": ... }` で、`title` は記事ページの実際のタイトル（例: 『Gemini 4 Argon in GitHub Copilot - GitHub Changelog』）にします。「原文」「GitHub Changelog」だけのような題は不可です。`references.documents` も、各ページの実際のタイトルを `title` に入れてください（最大 3 件、日本語版 `/ja/` があればそれを優先）。',
              '- `source` が一覧ページや「〜 changed」のような差分検出で、1 本の記事に特定できない更新は、スライドを作らずに飛ばし、PR 本文にその理由を書いてください。',
              '- URL は github.blog / github.com / docs.github.com / code.visualstudio.com / www.publickey1.jp / learn.microsoft.com のみ使えます。『未確認』『要確認』『推定』など内部メモの語は本文に使わないでください。',
              '- `status`（GA / Preview / 廃止など）は、原文が明示している場合だけ使い、その引用を `statusEvidence` に入れてください。根拠がなければ `unknown` か `update` にします。`beforeAfter` は、原文に変更前の記述があるときだけ書きます。',
              '- `evidence` には実際に確認した https URL を 1 件以上入れてください。',
              '- PR タイトルは `slides: update YYYY-MM-DD` にしてください。不確実な場合は `needs-human-review` を付けて停止してください。',
              '',
              '## 対象',
              '```json',
              JSON.stringify(pending, null, 2),
              '```',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'slide-authoring', per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            let issue;
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
              issue = (await github.rest.issues.get({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number })).data;
            } else {
              issue = (await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels })).data;
            }
            if ((issue.labels ?? []).some((label) => label.name === 'needs-human-review')) {
              core.info('Issue is blocked for human review; not assigning Copilot.');
              return;
            }
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            if (pulls.some((pull) => (/slide authoring request|^slides:/i.test(pull.title || '') || String(pull.body || '').includes('slide-authoring-request') || (pull.head?.ref || '').startsWith('copilot/slide-')) && /copilot/i.test(pull.user?.login || ''))) {
              core.info('A slide PR is already open; waiting for it to merge.');
              return;
            }
            try {
              const ctx = await github.graphql(
                `query($owner: String!, $repo: String!) {
                  repository(owner: $owner, name: $repo) {
                    id
                    suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 20) {
                      nodes { login __typename ... on Bot { id } ... on User { id } }
                    }
                  }
                }`,
                { owner: context.repo.owner, repo: context.repo.repo },
              );
              const actor = (ctx.repository.suggestedActors?.nodes ?? []).find((node) => copilotLogins.has(node.login) && node.id);
              if (!actor) {
                core.warning('Could not resolve the Copilot actor; assign the issue to Copilot manually.');
                return;
              }
              await github.graphql(
                `mutation($assignableId: ID!, $actorIds: [ID!]!, $targetRepositoryId: ID!, $customInstructions: String!) {
                  replaceActorsForAssignable(input: {
                    assignableId: $assignableId,
                    actorIds: $actorIds,
                    agentAssignment: { targetRepositoryId: $targetRepositoryId, baseRef: "main", customInstructions: $customInstructions }
                  }) { assignable { ... on Issue { id } } }
                }`,
                {
                  assignableId: issue.node_id,
                  actorIds: [actor.id],
                  targetRepositoryId: ctx.repository.id,
                  customInstructions: 'Issue のルールに従い、data/slides/*.json 以外は変更しないでください。不確実な場合は needs-human-review を付けて停止してください。',
                },
              );
              core.info(`Assigned issue #${issue.number} to Copilot.`);
            } catch (error) {
              core.warning(`Failed to assign Copilot: ${error.message}`);
            }
