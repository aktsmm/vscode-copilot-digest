name: Notify important Discord updates

# One short notification a day with what may need action: GA, Preview and retirement updates of the day before
# (so that their Japanese text exists). Nothing is sent on a quiet day.
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      date_key:
        description: Event log date (YYYY-MM-DD). Leave blank for yesterday (UTC).
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Send the important updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TARGET_DATE_KEY: ${{ inputs.date_key }}
        run: |
          date_key="$TARGET_DATE_KEY"
          if [ -z "$date_key" ]; then
            date_key=$(date -u -d 'yesterday' +%Y-%m-%d)
          fi
          if [[ ! "$date_key" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date_key must use YYYY-MM-DD" >&2
            exit 1
          fi
          node scripts/notify-discord.mjs --date "$date_key" --important-only

      - name: Report a failed notification
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Discord notification failed"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          body="A Discord notification failed: $RUN_URL. Check that the DISCORD_WEBHOOK_URL secret is valid and that the webhook still exists."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
