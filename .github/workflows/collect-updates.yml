name: Collect updates

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 5 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect updates
        run: npm run collect

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data summaries
          git commit -m "chore: collect daily updates"
          git push

      - name: Redeploy Pages after collect commit
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
            core.info('Dispatched Deploy GitHub Pages for the latest collected content.');

