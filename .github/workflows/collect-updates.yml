name: Collect updates

on:
  schedule:
    - cron: "30 21 * * *"
    - cron: "30 5 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Shared with the agent PR merger so the two never push to main at the same time.
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore verified resource page cache
        uses: actions/cache@v4
        with:
          path: .cache/resource-pages
          key: resource-pages-v1-${{ github.run_id }}
          restore-keys: resource-pages-v1-

      - name: Collect updates
        run: npm run collect

      # Feed articles can be missed (older runs dropped some as "low information"). Re-read them from
      # their own pages so nothing real is lost; a failure here must not block the normal collect.
      - name: Restore feed articles the collector missed
        continue-on-error: true
        run: |
          node scripts/backfill-skipped.mjs --coverage
          npm run render:summaries
          npm run enrich:resources

      - name: Validate collected output
        run: npm run test:data

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data summaries
          git commit -m "chore: collect daily updates"
          # main moves while a run is going (merged PRs), so a plain push can be rejected; rebase and retry.
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main"
            git pull --rebase origin main || { git rebase --abort 2>/dev/null; exit 1; }
          done
          echo "Could not push after retries" >&2
          exit 1

      # Runs after the commit so a gap is reported (failed run) without blocking the data.
      - name: Report feed coverage gaps
        run: node scripts/coverage-report.mjs --strict

      - name: Redeploy Pages after collect commit
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
            core.info('Dispatched Deploy GitHub Pages for the latest collected content.');
