name: Validate generated PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Collect changed files
        id: changed
        shell: bash
        run: |
          base_ref="origin/${{ github.base_ref }}"
          git fetch --no-tags --prune origin "${{ github.base_ref }}" --depth=50
          merge_base="$(git merge-base "$base_ref" HEAD || true)"

          if [ -z "$merge_base" ]; then
            git fetch --no-tags --prune origin "${{ github.base_ref }}" --depth=500
            merge_base="$(git merge-base "$base_ref" HEAD || true)"
          fi

          if [ -z "$merge_base" ]; then
            git fetch --no-tags --prune origin "${{ github.base_ref }}" --unshallow || true
            merge_base="$(git merge-base "$base_ref" HEAD || true)"
          fi

          if [ -z "$merge_base" ]; then
            echo "Could not determine a merge base with $base_ref" >&2
            exit 1
          fi

          {
            echo 'files<<EOF'
            git diff --name-only "$merge_base..HEAD"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Validate changed paths
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          node <<'NODE'
          const changed = (process.env.CHANGED_FILES || '').split(/\r?\n/).filter(Boolean);
          const allowed = [/^summaries\/daily\//, /^drafts\//, /^scripts\/lib\/reporting\.mjs$/];
          const blocked = changed.filter((file) => !allowed.some((pattern) => pattern.test(file)));
          if (blocked.length > 0) {
            console.error('Generated PR changed files outside the allow-list:');
            for (const file of blocked) {
              console.error(`- ${file}`);
            }
            process.exit(1);
          }
          NODE

      - name: Validate PR metadata
        run: |
          node <<'NODE'
          const title = process.env.PR_TITLE || '';
          const body = process.env.PR_BODY || '';
          const titlePattern = /^docs: update digest \d{4}-\d{2}-\d{2}(?: \+ drafts)?(?: \+ reporting)?$/;
          const authoringRequestTitlePattern = /^Digest authoring request: \d{4}-\d{2}-\d{2}$/;
          const bodyPattern = /Generated from `?data\/events\/\d{4}-\d{2}-\d{2}\.json`?/;
          const isPendingNormalization = authoringRequestTitlePattern.test(title);

          if (!titlePattern.test(title) && !isPendingNormalization) {
            console.error(`PR title does not match the generated PR rule: ${title}`);
            process.exit(1);
          }

          if (!bodyPattern.test(body) && !isPendingNormalization) {
            console.error('PR body is missing the required source marker: Generated from data/events/YYYY-MM-DD.json');
            process.exit(1);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate collect command
        run: npm run collect

      - name: Validate Pages build
        run: npm run build:pages

      - name: Validate Markdown structure
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const changed = (process.env.CHANGED_FILES || '').split(/\r?\n/).filter(Boolean);
          const markdownFiles = changed.filter((file) => /^(summaries\/daily|drafts)\/.*\.md$/.test(file));
          const sensationalPattern = /(絶対|必ず成功|革命的|最強|衝撃|完全無欠|間違いなく)/;

          for (const file of markdownFiles) {
            const content = fs.readFileSync(file, 'utf8');
            const lines = content.split(/\r?\n/);
            const tooLongLines = lines.filter((line) => line.length > 240 && !/^https?:\/\//.test(line));

            if (file.startsWith('summaries/daily/')) {
              for (const heading of ['## 注目トピック', '## テーマ別まとめ']) {
                if (!content.includes(heading)) {
                  console.error(`${file} is missing heading: ${heading}`);
                  process.exit(1);
                }
              }
            }

            if (file.startsWith('drafts/')) {
              const acceptedDraftHeadings = ['## 今回の要点', '## 今週の要点'];
              if (!acceptedDraftHeadings.some((heading) => content.includes(heading))) {
                console.error(`${file} is missing one of the required draft headings: ${acceptedDraftHeadings.join(', ')}`);
                process.exit(1);
              }
            }

            if (tooLongLines.length > 5) {
              console.error(`${file} has too many long lines (${tooLongLines.length}).`);
              process.exit(1);
            }

            if (sensationalPattern.test(content)) {
              console.error(`${file} contains sensational wording that should be reviewed.`);
              process.exit(1);
            }
          }
          NODE

      - name: Validate reporting mappings
        if: contains(steps.changed.outputs.files, 'scripts/lib/reporting.mjs')
        run: |
          node <<'NODE'
          const fs = require('fs');
          const content = fs.readFileSync('scripts/lib/reporting.mjs', 'utf8');
          const exactMappingsMatch = content.match(/const exactMappings = new Map\(\[(.*?)\n  \]\);/s);
          if (!exactMappingsMatch) {
            console.error('exactMappings block was not found in reporting.mjs');
            process.exit(1);
          }

          const keys = [...exactMappingsMatch[1].matchAll(/\[\s*"([^"]+)"\s*,/g)].map((match) => match[1]);
          const duplicates = keys.filter((key, index) => keys.indexOf(key) !== index);
          if (duplicates.length > 0) {
            console.error(`Duplicate exactMappings keys found: ${[...new Set(duplicates)].join(', ')}`);
            process.exit(1);
          }
          NODE
